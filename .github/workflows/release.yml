name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Test before release
        run: npm test
      - name: Preflight (fails the release if anything would leak or is missing)
        run: npm run preflight
      - name: Build installer + portable
        run: npm run dist:win
      - name: Extract release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $text = Get-Content CHANGELOG.md -Raw
          if ($text -match "(?s)## $([regex]::Escape($version)).*?\n(.*?)(?=\n## |\z)") { $Matches[1].Trim() | Out-File -Encoding utf8 notes.md } else { "Release ${{ github.ref_name }}" | Out-File -Encoding utf8 notes.md }
      - name: Publish GitHub release
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" dist/*.exe --title "ShiftSense ${{ github.ref_name }}" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
