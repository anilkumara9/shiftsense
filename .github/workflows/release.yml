name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Test before release
        run: npm test
      - name: Preflight (fails the release if anything would leak or is missing)
        run: npm run preflight
      - name: Build installer
        # --publish never is load-bearing: on a tag build electron-builder
        # auto-detects the GitHub remote and tries to publish by itself,
        # failing without a GH_TOKEN and racing the explicit publish step
        # below. The installer build itself succeeded in run 41337577989;
        # only the auto-publish failed. This workflow publishes via gh.
        run: |
          npm run preflight
          npx electron-builder --win nsis --publish never
      - name: Extract release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $text = Get-Content CHANGELOG.md -Raw
          if ($text -match "(?s)## $([regex]::Escape($version)).*?\n(.*?)(?=\n## |\z)") { $Matches[1].Trim() | Out-File -Encoding utf8 notes.md } else { "Release ${{ github.ref_name }}" | Out-File -Encoding utf8 notes.md }
      - name: Publish GitHub release
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" dist/*.exe --title "ShiftSense ${{ github.ref_name }}" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
